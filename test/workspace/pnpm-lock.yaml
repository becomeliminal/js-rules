# A workspace: one project depending on another project in the same repo, and
# on a package from the registry. pnpm records the first with link: and resolves
# nothing for it -- the repo builds it.
lockfileVersion: '9.0'

importers:

  .:
    dependencies:
      '@test/shared':
        specifier: link:shared
        version: link:shared
      ms:
        specifier: 2.1.3
        version: 2.1.3

  shared: {}

packages:

  'ms@2.1.3':
    resolution: {integrity: sha512-6FlzubTLZG3J2a/NVCAleEhjzq5oxgHyaCU9yYXvcLsvoVaHJq/s5xXI6/XXP6tz7R9xAOtHnSO/tXtF3WRTlA==}

snapshots:

