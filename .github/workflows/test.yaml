# Runs the whole test suite on Linux and on macOS. The plugin's build
# commands are shell run on the user's machine, and BSD userland (macOS)
# differs from GNU in ways a Linux-only run never sees: BSD wc pads its count,
# which once sent @types/node's "node v22.18" root one directory too deep on
# every Mac.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./pleasew test //...

      - name: Native lint rule
        run: |
          ./pleasew build //test/oxlint:clean
          test -f plz-out/gen/test/oxlint/clean/ok
          test -f plz-out/gen/test/oxlint/clean/checked-files.txt
          grep -q 'clean.js' plz-out/gen/test/oxlint/clean/checked-files.txt
          grep -q 'clean.ts' plz-out/gen/test/oxlint/clean/checked-files.txt
          for target in violation bad_config unsupported; do
            if ./pleasew build "//test/oxlint:$target"; then
              echo "expected $target to fail" >&2
              exit 1
            fi
          done
