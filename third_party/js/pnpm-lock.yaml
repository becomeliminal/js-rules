# The packages this repo's own tests build against. Written by hand rather than
# by pnpm so it stays small, but in the shape pnpm emits: static facts under
# `packages`, the resolved graph under `snapshots`, and the peer resolution
# folded into the snapshot key.
#
# It is chosen to exercise the cases that break: a scoped package, a package
# with a peer resolution, one package present at two versions, one of those
# bound under a second name, and a tool with a platform-specific binary.
